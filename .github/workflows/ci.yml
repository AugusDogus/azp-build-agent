name: CI

on:
  push:
    branches: [main]
    # Pushing a version tag (v2.0.0) publishes versioned images and a release.
    tags: ["v*.*.*"]
  pull_request:
  # Weekly rebuild so published images pick up base image and package updates,
  # and so upstream breakage (like a new Ubuntu release) shows up quickly.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint start.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck start.sh

  test:
    name: Test ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            platform: linux-musl-x64
          - variant: ubuntu
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.variant }}
          tags: azp-agent:test
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Tools are installed
        run: |
          docker run --rm --entrypoint bash azp-agent:test -euc '
            for tool in git jq curl az docker dockerd; do command -v "$tool"; done
            docker buildx version
            docker compose version
            az version --output none
          '

      - name: Agent runs on the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view -R microsoft/azure-pipelines-agent --json tagName --jq '.tagName | ltrimstr("v")')
          url="https://download.agent.dev.azure.com/agent/$version/vsts-agent-${{ matrix.platform }}-$version.tar.gz"
          echo "Agent $version: $url"
          docker run --rm --entrypoint bash -e URL="$url" azp-agent:test -euc '
            mkdir /tmp/agent && cd /tmp/agent
            curl -fsSL "$URL" | tar -xz
            ./bin/installdependencies.sh
            ./bin/Agent.Listener --version
          '

      # start.sh stops at the Azure DevOps lookup because AZP_URL points nowhere,
      # which is after the Docker setup these steps check.
      - name: Docker-in-Docker with a volume (overlay2)
        run: |
          docker run --rm --privileged -v azp-docker:/var/lib/docker \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            --entrypoint bash azp-agent:test -c './start.sh; docker run --rm hello-world' 2>&1 | tee out.log
          grep -q 'dockerd is up' out.log
          if grep -q 'vfs' out.log; then echo 'expected overlay, got vfs'; exit 1; fi
          grep -q 'Hello from Docker' out.log
          grep -q 'could not reach' out.log

      - name: Docker-in-Docker without a volume (vfs fallback)
        run: |
          docker run --rm --privileged \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            --entrypoint bash azp-agent:test -c './start.sh; docker run --rm hello-world' 2>&1 | tee out.log
          grep -q 'using the vfs storage driver' out.log
          grep -q 'Hello from Docker' out.log

      - name: Host Docker socket
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            azp-agent:test 2>&1 | tee out.log || true
          grep -q "Using the host's Docker daemon" out.log
          if grep -q 'Starting dockerd' out.log; then echo 'started its own dockerd'; exit 1; fi

      - name: No Docker available still starts the agent setup
        run: |
          docker run --rm -e DOCKERD_START_TIMEOUT=10 \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            azp-agent:test 2>&1 | tee out.log || true
          grep -q 'no Docker daemon available' out.log
          grep -q 'could not reach' out.log

  publish:
    name: Publish ${{ matrix.variant }}
    needs: [lint, test]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [alpine, ubuntu]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version tags must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that has been merged."; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Moving tags follow main (and the weekly rebuild). Version tags are
          # written once, when the version is tagged.
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=raw,value=latest-${{ matrix.variant }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ matrix.variant == 'ubuntu' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.variant }}-
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{version}},enable=${{ matrix.variant == 'ubuntu' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.variant == 'ubuntu' }}
            type=semver,pattern={{major}},enable=${{ matrix.variant == 'ubuntu' }}
          flavor: latest=false

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.variant }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          platforms: linux/amd64

  release:
    name: Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Images

            ```bash
            docker pull ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-ubuntu
            docker pull ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-alpine
            ```

            `X.Y.Z-<variant>` never changes. `X.Y-<variant>` and `X-<variant>` move to the newest release in that line.
            `ubuntu`, `alpine` and `latest` follow `main` and are rebuilt every Monday with security updates.
