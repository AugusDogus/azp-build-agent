name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild so published images pick up base image and package updates,
  # and so upstream breakage (like a new Ubuntu release) shows up quickly.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint start.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck start.sh

  test:
    name: Test ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            platform: linux-musl-x64
          - variant: ubuntu
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.variant }}
          tags: azp-agent:test
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Tools are installed
        run: |
          docker run --rm --entrypoint bash azp-agent:test -euc '
            for tool in git jq curl az docker dockerd; do command -v "$tool"; done
            docker buildx version
            docker compose version
            az version --output none
          '

      - name: Agent runs on the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view -R microsoft/azure-pipelines-agent --json tagName --jq '.tagName | ltrimstr("v")')
          url="https://download.agent.dev.azure.com/agent/$version/vsts-agent-${{ matrix.platform }}-$version.tar.gz"
          echo "Agent $version: $url"
          docker run --rm --entrypoint bash -e URL="$url" azp-agent:test -euc '
            mkdir /tmp/agent && cd /tmp/agent
            curl -fsSL "$URL" | tar -xz
            ./bin/installdependencies.sh
            ./bin/Agent.Listener --version
          '

      # start.sh stops at the Azure DevOps lookup because AZP_URL points nowhere,
      # which is after the Docker setup these steps check.
      - name: Docker-in-Docker with a volume (overlay2)
        run: |
          docker run --rm --privileged -v azp-docker:/var/lib/docker \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            --entrypoint bash azp-agent:test -c './start.sh; docker run --rm hello-world' 2>&1 | tee out.log
          grep -q 'dockerd is up' out.log
          ! grep -q 'vfs' out.log
          grep -q 'Hello from Docker' out.log
          grep -q 'could not reach' out.log

      - name: Docker-in-Docker without a volume (vfs fallback)
        run: |
          docker run --rm --privileged \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            --entrypoint bash azp-agent:test -c './start.sh; docker run --rm hello-world' 2>&1 | tee out.log
          grep -q 'using the vfs storage driver' out.log
          grep -q 'Hello from Docker' out.log

      - name: Host Docker socket
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            azp-agent:test 2>&1 | tee out.log || true
          grep -q "Using the host's Docker daemon" out.log
          ! grep -q 'Starting dockerd' out.log

      - name: No Docker available still starts the agent setup
        run: |
          docker run --rm -e DOCKERD_START_TIMEOUT=10 \
            -e AZP_URL=http://127.0.0.1:9 -e AZP_TOKEN=test \
            azp-agent:test 2>&1 | tee out.log || true
          grep -q 'no Docker daemon available' out.log
          grep -q 'could not reach' out.log

  publish:
    name: Publish ${{ matrix.variant }}
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [alpine, ubuntu]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=latest-${{ matrix.variant }}
            type=sha,prefix=${{ matrix.variant }}-
            type=raw,value=latest,enable=${{ matrix.variant == 'ubuntu' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.variant }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          platforms: linux/amd64
